name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:
  schedule:
    # Refresh the cron registration while keeping a 15-minute interval.
    - cron: "8,23,38,53 * * * *"

permissions:
  contents: read

# News updates supersede older deployments, including ones waiting on an environment.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Restore seen articles
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: dashboard-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dashboard-state-v1-
      - name: Collect and render news
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python dashboard.py
      - name: Save seen articles
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: dashboard-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare current dashboard
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          mkdir -p _site
          cp index.html _site/index.html
          # Keep the legacy URL current instead of publishing the stale snapshot.
          cp index.html _site/dashboard.html
          cp logo-observador.jpg icon.png privacidad.html _site/
          touch _site/.nojekyll
          cmp _site/index.html _site/dashboard.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: _site
          retention-days: 1

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
